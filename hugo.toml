#  ╔══════════════════════════════════════════╗
#  ║        PORTFOLIO  —  hugo.toml           ║
#  ║  Edit lines marked with  ← EDIT ME       ║
#  ╚══════════════════════════════════════════╝

baseURL  = "https://bmagwebu.github.io/my-portfolio/"  # ← EDIT ME
title    = "Bongani Magwebu – Portfolio"                                  # ← EDIT ME

languageCode   = "en"
defaultContentLanguage = "en"

enableRobotsTXT = true
enableGitInfo   = false

[params]
  # Shown in browser tab & SEO
  description = "Personal portfolio of Your Name – Full Stack Developer"  # ← EDIT ME
  author      = "Your Name"                                               # ← EDIT ME

[module]
  [module.hugoVersion]
    min = "0.123.0"
  [[module.imports]]
    path = "github.com/zetxek/adritian-free-hugo-theme"
  # ── required mounts so Hugo finds the theme's files ──
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  # Bootstrap (installed via npm)
  [[module.mounts]]
    source = "node_modules/bootstrap/scss"
    target = "assets/scss/bootstrap"
  [[module.mounts]]
    source = "node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"
    target = "assets/js/bootstrap.bundle.min.js"

# ── Navigation menu ──────────────────────────────────────
[menu]
  [[menu.main]]
    name   = "HOME"
    url    = "/"
    weight = 1
  [[menu.main]]
    name   = "ABOUT"
    url    = "/#about"
    weight = 2
  [[menu.main]]
    name   = "SKILLS"
    url    = "/skills"
    weight = 3
  [[menu.main]]
    name   = "PORTFOLIO"
    url    = "/#client-and-work-section"
    weight = 4
  [[menu.main]]
    name   = "BLOG"
    url    = "/blog"
    weight = 5
  [[menu.main]]
    identifier = "email"
    name       = "CONTACT"
    url        = "/#contact"
    weight     = 6

# ── Output formats needed for search ─────────────────────
[outputs]
  home    = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

# ── Markup ───────────────────────────────────────────────
[markup]
  [markup.goldmark.renderer]
    unsafe = true        # allow HTML in markdown content
  [markup.highlight]
    style = "monokai"
