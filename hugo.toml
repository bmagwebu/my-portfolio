baseURL  = "https://bmagwebu.github.io/my-portfolio/"  # ← EDIT ME
title    = "Bongani Magwebu– Portfolio"                                  # ← EDIT ME
languageCode = "en"

[pagination]
  pagerSize = 3

[outputs]
  page    = ["HTML"]
  home    = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[taxonomies]
  tag      = "tags"
  category = "categories"
  author   = "authors"

[module]
  [[module.imports]]
    path = "github.com/zetxek/adritian-free-hugo-theme"

  # ── Site source folders ──────────────────────────────────────
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"

  # ── Bootstrap (npm) ──────────────────────────────────────────
  [[module.mounts]]
    source = "node_modules/bootstrap/scss"
    target = "assets/scss/bootstrap"
  [[module.mounts]]
    source = "node_modules/bootstrap/dist/js"
    target = "assets/js/bootstrap"
  [[module.mounts]]
    source = "node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"
    target = "assets/js/vendor/bootstrap.bundle.min.js"   # ← exact path the theme fingerprints
  [[module.mounts]]
    source = "node_modules/bootstrap-print-css/css/bootstrap-print.css"
    target = "assets/css/bootstrap-print.css"

[params]
  title       = "Your Name – Portfolio"                   # ← EDIT ME
  description = "Personal portfolio of Your Name"         # ← EDIT ME
  images      = ["/images/avatar.png"]

  sections = [
    "showcase",
    "about",
    "education",
    "experience",
    "client-and-work",
    "testimonial",
    "contact",
  ]

  homepageExperienceCount = 6

  [params.seo]
    siteName        = "Your Name"                         # ← EDIT ME
    siteDescription = "Personal portfolio and CV"

  [params.analytics]
    vercelPageInsights = false
    vercelAnalytics    = false
    [params.analytics.googleAnalytics]
      code    = "UA-XXXXX-Y"
      enabled = false

  # ── Plugins (required — tells theme which CSS/JS to load) ────
  [params.plugins]
    [[params.plugins.css]]
      URL = "css/custom.css"
    [[params.plugins.css]]
      URL = "css/adritian-icons.css"
    [[params.plugins.css]]
      URL = "css/bootstrap-print.css"
    [[params.plugins.js]]
      URL = "js/rad-animations.js"
    [[params.plugins.js]]
      URL = "js/sticky-header.js"
    [[params.plugins.js]]
      URL = "js/library/fontfaceobserver.js"
    [[params.plugins.scss]]
      URL = "scss/adritian.scss"

  [params.colorTheme]
    [params.colorTheme.selector.disable]
      footer       = false
      header       = false
      mobileHeader = false

  [params.languages.selector.disable]
    footer       = false
    header       = false
    mobileHeader = false

  [params.experience]
    showJobCard = true

  [params.blog]
    layout        = "sidebar-right"
    sidebarWidth  = "25"
    narrowContent = true
    showRecentPosts = true
    recentPostCount = 5
    listStyle     = "summary"

  [params.sharing]
    bluesky  = true
    mastodon = true

# ── Build stats (needed for PostCSS/PurgeCSS in theme) ──────────
[build]
  writeStats = true
  [build.buildStats]
    enabledFor    = ["scss"]
    disableClasses = false
    disableIDs     = false
    disableTags    = false
    enable         = true

# ── Markup ───────────────────────────────────────────────────────
[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    lineNos   = false
    noClasses = false
    style     = "github"

[imaging]
  resampleFilter = "Lanczos"
  quality        = 85
  anchor         = "Smart"

[minify]
  minifyOutput = true

# ── Navigation menus ─────────────────────────────────────────────
[languages]

  [languages.en]
    disabled          = false
    languageCode      = "en"
    languageDirection = "ltr"
    languageName      = "English"
    weight            = 0

    [languages.en.menus]
      [[languages.en.menus.header]]
        name   = "Home"
        URL    = "/"
        weight = 1
      [[languages.en.menus.header]]
        name   = "About"
        URL    = "/#about"
        weight = 2
      [[languages.en.menus.header]]
        name   = "Skills"
        URL    = "/skills"
        weight = 3
      [[languages.en.menus.header]]
        name   = "Portfolio"
        URL    = "/#client-and-work-section"
        weight = 4
      [[languages.en.menus.header]]
        name   = "Blog"
        URL    = "/blog"
        weight = 5
      [[languages.en.menus.header]]
        pre    = "email"
        name   = "Contact"
        URL    = "/#contact"
        weight = 6

      [[languages.en.menus.footer]]
        name   = "Home"
        URL    = "/"
        weight = 1
      [[languages.en.menus.footer]]
        name   = "About"
        URL    = "/#about"
        weight = 2
      [[languages.en.menus.footer]]
        name   = "Portfolio"
        URL    = "/#client-and-work-section"
        weight = 3
      [[languages.en.menus.footer]]
        name   = "Contact"
        URL    = "/#contact"
        weight = 4
