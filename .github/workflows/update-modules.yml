name: Update Hugo Modules (go.sum)

# Run this ONCE manually after first push, or it runs automatically
# on any change to go.mod
on:
  push:
    paths:
      - "go.mod"
  workflow_dispatch:

permissions:
  contents: write   # needs write to commit go.sum back

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.136.0
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo Extended
        run: |
          wget -q -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: false

      - name: Download modules & generate go.sum
        env:
          GONOSUMCHECK: "*"
          GONOSUMDB: "*"
          GOFLAGS: "-mod=mod"
        run: go mod download

      - name: Commit go.sum if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add go.sum go.mod
          git diff --staged --quiet || git commit -m "chore: update Hugo module checksums"
          git push
