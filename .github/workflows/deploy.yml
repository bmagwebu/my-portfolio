name: Deploy Hugo Portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:   # lets you trigger a deploy manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # ─────────────────────────────────────────────────────
  # JOB 1 — Build the Hugo site
  # ─────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.136.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history (used by Hugo's .GitInfo)

      # ── Install Hugo Extended (SCSS support required by Adritian) ──
      - name: Install Hugo CLI (Extended)
        run: |
          wget -q -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      # ── Install Dart Sass (used by the theme) ──
      - name: Install Dart Sass
        run: sudo snap install dart-sass

      # ── Go toolchain (required for Hugo modules) ──
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: false

      # ── Node.js + Bootstrap ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies (Bootstrap)
        run: npm install

      # ── Hugo module + build cache ──
      - name: Cache Hugo modules
        uses: actions/cache@v4
        with:
          path: |
            /tmp/hugo_cache
            ~/.cache/hugo_cache
          key: ${{ runner.os }}-hugo-${{ hashFiles('go.mod') }}-${{ env.HUGO_VERSION }}
          restore-keys: |
            ${{ runner.os }}-hugo-${{ hashFiles('go.mod') }}-
            ${{ runner.os }}-hugo-

      # ── Download Hugo modules (generates/updates go.sum) ──
      - name: Download Hugo modules
        env:
          HUGO_CACHEDIR: /tmp/hugo_cache
          GONOSUMCHECK: "*"
          GONOSUMDB: "*"
          GOFLAGS: "-mod=mod"
        run: hugo mod download

      # ── Configure GitHub Pages ──
      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # ── Build ──
      - name: Build site with Hugo
        env:
          HUGO_CACHEDIR: /tmp/hugo_cache
          HUGO_ENVIRONMENT: production
          GONOSUMCHECK: "*"
          GONOSUMDB: "*"
          GOFLAGS: "-mod=mod"
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # ─────────────────────────────────────────────────────
  # JOB 2 — Deploy to GitHub Pages
  # ─────────────────────────────────────────────────────
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
